name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set version from tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          const version = process.env.TAG_VERSION;

          if (!version) {
            throw new Error("TAG_VERSION is not set");
          }

          for (const path of ["manifest.json", "package.json"]) {
            const data = JSON.parse(fs.readFileSync(path, "utf8"));
            data.version = version;
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");
          }

          console.log(`Version set to ${version}`);
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare release files
        run: |
          mkdir -p release-artifacts
          cp main.js release-artifacts/main.js
          cp manifest.json release-artifacts/manifest.json

      - name: Update repository versions
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout --detach "origin/${{ github.event.repository.default_branch }}"

          export MIN_APP_VERSION=$(node -p "require('./manifest.json').minAppVersion")

          node <<'EOF'
          const fs = require("fs");

          const version = process.env.TAG_VERSION;
          const minAppVersion = process.env.MIN_APP_VERSION;

          if (!version) {
            throw new Error("TAG_VERSION is not set");
          }

          if (!minAppVersion) {
            throw new Error("MIN_APP_VERSION is not set");
          }

          for (const path of ["manifest.json", "package.json"]) {
            const data = JSON.parse(fs.readFileSync(path, "utf8"));
            data.version = version;
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");
          }

          const versionsPath = "versions.json";
          let versions = {};

          if (fs.existsSync(versionsPath)) {
            versions = JSON.parse(fs.readFileSync(versionsPath, "utf8"));
          }

          versions[version] = minAppVersion;

          const sortedVersions = Object.fromEntries(
            Object.entries(versions).sort((a, b) =>
              b[0].localeCompare(a[0], undefined, { numeric: true })
            )
          );

          fs.writeFileSync(
            versionsPath,
            JSON.stringify(sortedVersions, null, 2) + "\n"
          );

          console.log(`Added ${version}: ${minAppVersion} to versions.json`);
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json package.json versions.json

          if git diff --cached --quiet; then
            echo "Version files are already up to date."
          else
            git commit -m "chore: release ${TAG_VERSION}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/main.js

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/main.js
            release-artifacts/manifest.json
