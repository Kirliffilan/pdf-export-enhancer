name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set version from tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"

          node <<'EOF'
          const fs = require("fs");

          for (const path of ["manifest.json", "package.json"]) {
            const data = JSON.parse(
              fs.readFileSync(path, "utf8")
            );

            data.version = process.env.TAG_VERSION;

            fs.writeFileSync(
              path,
              JSON.stringify(data, null, 2) + "\n"
            );
          }
          EOF

          echo "Version set to ${TAG_VERSION}"

          echo "manifest.json:"
          node -p "require('./manifest.json').version"

          echo "package.json:"
          node -p "require('./package.json').version"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare release files
        run: |
          mkdir -p release-artifacts
          cp main.js release-artifacts/main.js
          cp manifest.json release-artifacts/manifest.json

      - name: Update repository versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"

          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout --detach "origin/${{ github.event.repository.default_branch }}"

          node <<'EOF'
          const fs = require("fs");

          const manifestPath = "manifest.json";
          const packagePath = "package.json";
          const versionsPath = "versions.json";

          for (const path of [manifestPath, packagePath]) {
            const data = JSON.parse(
              fs.readFileSync(path, "utf8")
            );

            data.version = process.env.TAG_VERSION;

            fs.writeFileSync(
              path,
              JSON.stringify(data, null, 2) + "\n"
            );
          }

          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, "utf8")
          );

          let versions = {};

          if (fs.existsSync(versionsPath)) {
            versions = JSON.parse(
              fs.readFileSync(versionsPath, "utf8")
            );
          }

          versions[process.env.TAG_VERSION] =
            manifest.minAppVersion;

          const sortedVersions = Object.fromEntries(
            Object.entries(versions).sort((a, b) =>
              b[0].localeCompare(a[0], undefined, {
                numeric: true
              })
            )
          );

          fs.writeFileSync(
            versionsPath,
            JSON.stringify(sortedVersions, null, 2) + "\n"
          );
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json package.json versions.json

          if git diff --cached --quiet; then
            echo "Version files are already up to date."
          else
            git commit -m "chore: release ${TAG_VERSION}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/main.js

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/main.js
            release-artifacts/manifest.json
