name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare release version
        env:
          TAG_VERSION: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $TAG_VERSION"
            exit 1
          fi

          git fetch origin "$DEFAULT_BRANCH"

          git checkout --detach "origin/$DEFAULT_BRANCH"

          export TAG_VERSION
          export MIN_APP_VERSION

          MIN_APP_VERSION=$(node -p "require('./manifest.json').minAppVersion")

          node <<'EOF'
          const fs = require("fs");

          const version = process.env.TAG_VERSION;
          const minAppVersion = process.env.MIN_APP_VERSION;

          if (!version) {
            throw new Error("TAG_VERSION is not set");
          }

          if (!minAppVersion) {
            throw new Error("MIN_APP_VERSION is not set");
          }

          const manifestPath = "manifest.json";
          const packagePath = "package.json";
          const versionsPath = "versions.json";

          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, "utf8")
          );

          manifest.version = version;

          fs.writeFileSync(
            manifestPath,
            JSON.stringify(manifest, null, 2) + "\n"
          );

          const packageJson = JSON.parse(
            fs.readFileSync(packagePath, "utf8")
          );

          packageJson.version = version;

          fs.writeFileSync(
            packagePath,
            JSON.stringify(packageJson, null, 2) + "\n"
          );

          let versions = {};

          if (fs.existsSync(versionsPath)) {
            versions = JSON.parse(
              fs.readFileSync(versionsPath, "utf8")
            );
          }

          delete versions.undefined;

          versions[version] = minAppVersion;

          const sortedVersions = Object.fromEntries(
            Object.entries(versions).sort((a, b) =>
              b[0].localeCompare(a[0], undefined, {
                numeric: true
              })
            )
          );

          fs.writeFileSync(
            versionsPath,
            JSON.stringify(sortedVersions, null, 2) + "\n"
          );

          console.log(`Release version: ${version}`);
          console.log(`Minimum Obsidian version: ${minAppVersion}`);
          EOF

      - name: Commit release version
        env:
          TAG_VERSION: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json package.json versions.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: release ${TAG_VERSION}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - name: Move release tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          git tag -f "$TAG_VERSION"
          git push --force origin "$TAG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare release files
        run: |
          mkdir -p release-artifacts
          cp main.js release-artifacts/main.js
          cp manifest.json release-artifacts/manifest.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/main.js

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/main.js
            release-artifacts/manifest.json
