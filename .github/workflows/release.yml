name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          MIN_APP_VERSION=$(node -p "require('./manifest.json').minAppVersion")

          echo "Tag version: $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"
          echo "Min app version: $MIN_APP_VERSION"

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi

          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "MIN_APP_VERSION=$MIN_APP_VERSION" >> "$GITHUB_ENV"

      - name: Update versions.json
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout --detach "origin/${{ github.event.repository.default_branch }}"

          node <<'EOF'
          const fs = require("fs");

          const path = "versions.json";
          let versions = {};

          if (fs.existsSync(path)) {
            versions = JSON.parse(fs.readFileSync(path, "utf8"));
          }

          versions[process.env.TAG_VERSION] = process.env.MIN_APP_VERSION;

          const sortedVersions = Object.fromEntries(
            Object.entries(versions).sort((a, b) =>
              b[0].localeCompare(a[0], undefined, { numeric: true })
            )
          );

          fs.writeFileSync(
            path,
            JSON.stringify(sortedVersions, null, 2) + "\n"
          );
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add versions.json

          if git diff --cached --quiet; then
            echo "versions.json is already up to date."
          else
            git commit -m "chore: add version ${TAG_VERSION} to versions.json"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Build
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
